<section class="page-user">

    <h1 class="title-form">
        Realizar Pedido
    </h1>


    <form
        [formGroup]="formData"
        (ngSubmit)="onSubmit()"
        class="newUsers"
    >

        <!-- NOMBRE -->
        <div class="items">

            <label for="name_usuario">
                Nombre completo
            </label>

            <input
                id="name_usuario"
                type="text"
                formControlName="name_usuario"
                placeholder="Ingrese su nombre"
            >

        </div>


        <!-- DIRECCIÓN -->
        <div class="items">

            <label for="direccion_entrega">
                Dirección
            </label>

            <input
                id="direccion_entrega"
                type="text"
                formControlName="direccion_entrega"
                placeholder="Ingrese la dirección"
            >

        </div>


        <!-- DIRECCIÓN OPCIONAL -->
        <div class="items">

            <label for="direccion_opcional">
                Dirección opcional
            </label>

            <input
                id="direccion_opcional"
                type="text"
                formControlName="direccion_opcional"
                placeholder="Apartamento, torre, casa, etc."
            >

        </div>


        <!-- BARRIO -->
        <div class="items">

            <label for="barrio">
                Barrio
            </label>

            <input
                id="barrio"
                type="text"
                formControlName="barrio"
                placeholder="Ingrese el barrio"
            >

        </div>


        <!-- TELÉFONO -->
        <div class="items">

            <label for="telefeno">
                Teléfono
            </label>

            <input
                id="telefeno"
                type="tel"
                formControlName="telefeno"
                placeholder="Ingrese su teléfono"
            >

        </div>


        <!-- PRODUCTOS -->
        <div class="items">

            <label for="productos">
                Productos
            </label>

            <input
                id="productos"
                type="text"
                formControlName="productos"
                placeholder="Productos seleccionados"
            >

        </div>


        <!-- PRECIO -->
        <div class="items">

            <label for="precio_total">
                Precio total
            </label>

            <input
                id="precio_total"
                type="number"
                formControlName="precio_total"
                readonly
            >

        </div>


        <!-- BOTÓN -->
        <div class="form-actions">

            <button
                type="submit"
                [disabled]="formData.invalid"
                [class.btn-disable]="formData.invalid"
            >
                Confirmar Pedido
            </button>

        </div>

    </form>

</section>
