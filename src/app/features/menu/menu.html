<div class="page-container">

    <div class="header-section">
        <h1 class="menu-title">NUESTRO MENÚ</h1>
        <p class="menu-subtitle">Elige tu categoría favorita y descubre el sabor</p>
    </div>

    <div class="menu-grid">
        <!-- 
          Bucle interactivo @for (Angular 17+)
          - 'categories$ | async': Suscribe automáticamente al Observable traído del Backend
          - 'track category._id || category.id': Identificador único para optimizar el DOM
        -->
        @for (product of productsList; track product._id || product.id) {

        <!-- Enlace de navegación hacia los productos de la categoría seleccionada -->
        <a [routerLink]="['/menu', product._id || product.id]" class="menu-card">

            <!-- Contenedor con la imagen principal de la categoría -->
            <div class="img-wrapper">
                <img [src]="product.urlImage" [alt]="product.name" class="category-img"

                    (error)="handleImageError($event)" loading="lazy">
                <div class="img-overlay"></div>
            </div>

            <!-- Bloque de texto y acción de la tarjeta -->
            <div class="card-content">
                <h3 class="category-title">{{ product.name }}</h3>
                <h4 class="category-description">{{ product.description }}</h4>
                <h4 class="category-price">{{ product.price }}</h4>
                <span class="card-btn">
                    Ver productos
                    <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </span>
            </div>
        </a>
        } @empty {
        <!-- Estado que se muestra si la API no devuelve categorías disponibles -->
        <div class="no-data-container">
            <p class="no-data">🍗 No hay productos disponibles en este momento.</p>
        </div>
        }
        <app-cart-floating></app-cart-floating>
    </div>
</div>
