<button *ngIf="isVisible" class="cart-floating-btn" (click)="openCart()">
    <!-- Onda expansiva (Glow pulse) -->
    <span class="pulse-wave"></span>

    <!-- Contenedor del ícono -->
    <div class="cart-icon-box">
        <fa-icon [icon]="faShoppingCart"></fa-icon>
    </div>

    <!-- Badge contador -->
    @if ((cartCount$ | async); as cartCount) {
        @if (cartCount > 0) {
            <span class="cart-badge">{{ cartCount }}</span>
        }
    }
</button>
