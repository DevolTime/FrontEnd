<div class="carousel-container" (mouseenter)="stopAutoPlay()" (mouseleave)="startAutoPlay()">
  <!-- Slides -->
  <div class="carousel-slides" [style.transform]="'translateX(-' + (currentIndex * 100) + '%)'">
    <div class="carousel-slide" *ngFor="let banner of banners">
      <a [routerLink]="['/categoria']" class="slide-link">
        <img [src]="banner.src" [alt]="banner.alt" />
      </a>
    </div>
  </div>

  <!-- Flechas de navegación -->
  <button class="nav-btn prev" (click)="prevSlide()" aria-label="Anterior">&#10094;</button>
  <button class="nav-btn next" (click)="nextSlide()" aria-label="Siguiente">&#10095;</button>

  <!-- Indicadores -->
  <div class="carousel-dots">
    <span
      *ngFor="let banner of banners; let i = index"
      class="dot"
      [class.active]="i === currentIndex"
      (click)="goToSlide(i)">
    </span>
  </div>
</div>
